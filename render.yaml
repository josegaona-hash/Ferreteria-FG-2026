# Despliegue en Render (https://render.com): New > Blueprint y elegir este repositorio.
services:
  - type: web
    name: ferreteria-fg
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ferreteria-fg-db
          property: connectionString

databases:
  - name: ferreteria-fg-db
    plan: free
